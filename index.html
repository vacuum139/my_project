        localStorage.setItem('deepseek_api_key', document.getElementById('api-key').value.trim());

    // 获取当前要展示的题目列表

        return isWrongMode ? wrongBook : allQuestions;
    }

    // 渲染题目
    function renderQuestion() {
        const list = getCurrentList();
        const quizArea = document.getElementById('quiz-area');
        const emptyState = document.getElementById('empty-state');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const expBox = document.getElementById('explanation-box');

        if (list.length === 0 || currentIndex >= list.length) {
            if (isWrongMode && list.length === 0) {
                quizArea.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else if (!isWrongMode && currentIndex >= list.length) {
                document.getElementById('question-text').innerText = "🎉 恭喜你，刷完了所有题目！";
                document.getElementById('options-container').innerHTML = "";
                submitBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
            }
            return;
        }

        quizArea.classList.remove('hidden');
        emptyState.classList.add('hidden');

        const q = list[currentIndex];
        document.getElementById('progress-text').innerText = `进度: ${currentIndex + 1} / ${list.length} ${isWrongMode ? '(错题)' : ''}`;
        document.getElementById('score-text').innerText = `得分: ${score}`;
        document.getElementById('question-text').innerText = q["题目"];
        
        // 渲染选项
        const optionsContainer = document.getElementById('options-container');

            }
        });

        // 重置状态
        answered = false;
        submitBtn.classList.remove('hidden');
        nextBtn.classList.add('hidden');
        expBox.style.display = 'none';
        expBox.innerHTML = '';
    }

        if (apiKey) {
            expBox.innerHTML += `<em>🤖 AI 老师正在思考中...</em>`;
            try {
                const aiText = await fetchDeepSeekExplanation(apiKey, q, userAnswer);
                expBox.innerHTML = `<strong>${userAnswer === correctAnswer ? '✅ 回答正确！' : '❌ 回答错误。正确答案是：' + correctAnswer}</strong><br><br><strong>AI 解析：</strong><br>${aiText}`;
            } catch (e) {
                expBox.innerHTML += `<br><span style="color:red">AI 调用失败：${e.message}</span>`;
            }
        } else {
            expBox.innerHTML += `<br><em>提示：填入 API Key 可获得 AI 详细解析。原解析：${q["解析"] || '无'}</em>`;
        }
    }

    // 下一题
   function nextQuestion() {
    currentIndex++;
    if (!isWrongMode) {
        localStorage.setItem('quiz_currentIndex', currentIndex);
    }
    renderQuestion();
}
    // 错题本逻辑
    function addToWrongBook(q) {
        const exists = wrongBook.find(item => item["题目"] === q["题目"]);
        if (!exists) {
            wrongBook.push(q);
            localStorage.setItem('wrong_book', JSON.stringify(wrongBook));
        }
    }

    function removeFromWrongBook(questionText) {
        wrongBook = wrongBook.filter(item => item["题目"] !== questionText);
        localStorage.setItem('wrong_book', JSON.stringify(wrongBook));
    }

    function clearWrongBook() {
        if (confirm("确定要清空错题本吗？")) {
            wrongBook = [];
            localStorage.setItem('wrong_book', JSON.stringify(wrongBook));
            if (isWrongMode) toggleMode();
        }
    }

    // 切换模式
    function toggleMode() {
        isWrongMode = !isWrongMode;
        if (!isWrongMode) {
    		currentIndex = parseInt(localStorage.getItem('quiz_currentIndex')) || 0;
    		score = parseInt(localStorage.getItem('quiz_score')) || 0;
		} else {
    		currentIndex = 0;
   		 	score = 0;
		}
        
        const btn = document.getElementById('toggle-mode-btn');
        const clearBtn = document.getElementById('clear-wrong-btn');
        const title = document.getElementById('mode-title');

        if (isWrongMode) {
            btn.innerText = "📚 返回全部题库";
            btn.className = "btn-primary";
            clearBtn.classList.remove('hidden');
            title.innerText = "❌ 我的错题本";
        } else {
            btn.innerText = "❌ 查看错题本";
            btn.className = "btn-outline";
            clearBtn.classList.add('hidden');
            title.innerText = "📝 市场调查 · 在线刷题";
        }
        renderQuestion();
    }

    // CSV 导入逻辑
    document.getElementById('csv-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                if (results.data.length > 0) {
                    // 存入 localStorage
                    let importedQs = JSON.parse(localStorage.getItem('imported_questions') || '[]');
                    importedQs = importedQs.concat(results.data);
                    localStorage.setItem('imported_questions', JSON.stringify(importedQs));
                    
                    // 重新加载合并题库
                    allQuestions = [...defaultQuestions, ...importedQs];
                    alert(`成功导入 ${results.data.length} 道题！`);
                    
                    if (!isWrongMode) {
                        currentIndex = 0;
                        renderQuestion();
                    }
                }
            },
            error: function(error) {
                alert("CSV 解析失败：" + error.message);
            }
        });
        // 清空 input 允许重复上传同一个文件
        this.value = '';
    });

    // 调用 DeepSeek API
    async function fetchDeepSeekExplanation(apiKey, question, userAnswer) {
        const prompt = `题目：${question["题目"]}\n选项：A.${question["选项A"]} B.${question["选项B"]} C.${question["选项C"]} D.${question["选项D"]}\n正确答案：${question["正确答案"]}\n用户选择了：${userAnswer}。\n请用大约100字解释这道题为什么选正确答案，并指出易错点。`;
        
        const response = await fetch("https://api.deepseek.com/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: "deepseek-chat",
                messages: [{ role: "user", content: prompt }],
                temperature: 0.7
            })
        });

        if (!response.ok) {
            throw new Error("请求失败，请检查 API Key");
        }

        const data = await response.json();
        return data.choices[0].message.content;
    }
</script>
