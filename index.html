<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线刷题</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    color: #2b2f36;
    padding: 24px 16px 60px;
  }
  .container {
    max-width: 860px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  header {
    padding: 28px 32px 20px;
    background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
    color: #fff;
  }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  header p { margin-top: 6px; font-size: 14px; opacity: 0.75; }

  /* 进度条 */
  .progress-wrap { padding: 20px 32px 0; }
  .progress-info {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 15px; color: #6b7280; margin-bottom: 8px;
  }
  .progress-info .score { color: #4b6cb7; font-weight: 700; }
  .progress-bar {
    width: 100%; height: 12px; background: #e5e7eb; border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4b6cb7, #34d399);
    border-radius: 999px; transition: width 0.4s ease;
  }

  .content { padding: 24px 32px 36px; }
  .hidden { display: none !important; }

  /* 加载态 */
  .loading { text-align: center; padding: 80px 0; color: #9ca3af; font-size: 16px; }
  .loading .spinner {
    width: 44px; height: 44px; border: 4px solid #e5e7eb; border-top-color: #4b6cb7;
    border-radius: 50%; margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 题目 */
  .q-type {
    display: inline-block; font-size: 14px; font-weight: 600;
    color: #4b6cb7; background: #eef2ff; padding: 4px 12px;
    border-radius: 999px; margin-bottom: 14px;
  }
  .q-stem {
    font-size: 20px; line-height: 1.7; font-weight: 600;
    color: #1f2937; margin-bottom: 22px; white-space: pre-wrap;
  }

  /* 选项（大字体） */
  .options { display: flex; flex-direction: column; gap: 14px; }
  .option {
    display: flex; align-items: center; gap: 14px;
    font-size: 20px; line-height: 1.5; cursor: pointer;
    padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 14px;
    background: #fafafa; transition: all 0.15s ease; user-select: none;
  }
  .option:hover { border-color: #4b6cb7; background: #f0f4ff; }
  .option .badge {
    flex: none; width: 36px; height: 36px; border-radius: 10px;
    background: #e5e7eb; color: #374151; font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .option.selected { border-color: #4b6cb7; background: #eef2ff; }
  .option.selected .badge { background: #4b6cb7; color: #fff; }
  .option.correct { border-color: #10b981; background: #ecfdf5; }
  .option.correct .badge { background: #10b981; color: #fff; }
  .option.wrong { border-color: #ef4444; background: #fef2f2; }
  .option.wrong .badge { background: #ef4444; color: #fff; }
  .option.locked { pointer-events: none; }

  .btn {
    display: inline-block; border: none; cursor: pointer;
    font-size: 18px; font-weight: 600; color: #fff;
    padding: 14px 40px; border-radius: 12px;
    background: linear-gradient(135deg, #4b6cb7, #35507e);
    box-shadow: 0 6px 16px rgba(75,108,183,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(75,108,183,0.45); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn.secondary { background: #eef2ff; color: #4b6cb7; box-shadow: none; }
  .actions { margin-top: 26px; display: flex; gap: 14px; flex-wrap: wrap; }

  .result-banner {
    margin-top: 22px; padding: 14px 18px; border-radius: 12px;
    font-size: 18px; font-weight: 700; display: none;
  }
  .result-banner.show { display: block; }
  .result-banner.ok { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .result-banner.bad { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

  /* 解析区 */
  .explain { margin-top: 22px; }
  .explain-title { font-size: 17px; font-weight: 700; color: #374151; margin-bottom: 10px; }
  .explain-body {
    font-size: 16px; line-height: 1.9; color: #374151;
    background: #f8fafc; border-left: 4px solid #4b6cb7;
    border-radius: 0 12px 12px 0; padding: 18px 22px;
    white-space: pre-wrap; word-break: break-word;
  }
  .explain-loading { color: #9ca3af; font-size: 15px; padding: 12px 0; }

  /* 设置面板 */
  .settings {
    margin-top: 28px; padding: 20px; border-radius: 14px;
    background: #f8fafc; border: 1px solid #e5e7eb;
  }
  .settings label { font-size: 15px; font-weight: 600; color: #374151; display: block; margin-bottom: 8px; }
  .settings input {
    width: 100%; font-size: 16px; padding: 12px 16px;
    border: 2px solid #d1d5db; border-radius: 10px; outline: none;
    transition: border-color 0.15s ease;
  }
  .settings input:focus { border-color: #4b6cb7; }
  .settings .hint { font-size: 13px; color: #9ca3af; margin-top: 8px; }

  /* 完成页 */
  .finish { text-align: center; padding: 60px 0 30px; }
  .finish .emoji { font-size: 64px; }
  .finish h2 { font-size: 28px; margin: 16px 0 8px; color: #1f2937; }
  .finish p { font-size: 17px; color: #6b7280; }

  .error-box {
    margin: 40px auto; max-width: 600px; text-align: center;
    background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
    border-radius: 14px; padding: 30px; font-size: 16px; line-height: 1.8;
  }
  @media (max-width: 640px) {
    .option { font-size: 18px; padding: 14px 16px; }
    .q-stem { font-size: 18px; }
    header, .progress-wrap, .content { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📝 在线刷题</h1>
    <p>题库自动加载 · AI 智能解析</p>
  </header>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    正在加载题库…
  </div>

  <div id="errorBox" class="error-box hidden">
    题库加载失败，请检查网络后刷新页面重试。<br>
    <span id="errorMsg" style="font-size:13px;color:#9ca3af;"></span>
  </div>

  <div id="main" class="hidden">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progressText">第 0 / 0 题</span>
        <span class="score" id="scoreText">得分：0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="content">
      <div id="quizArea">
        <span class="q-type" id="qType"></span>
        <div class="q-stem" id="qStem"></div>
        <div class="options" id="options"></div>

        <div class="result-banner" id="resultBanner"></div>

        <div class="actions">
          <button class="btn" id="submitBtn">提交答案</button>
          <button class="btn secondary hidden" id="nextBtn">下一题 →</button>
        </div>

        <div class="explain hidden" id="explainBox">
          <div class="explain-title">🤖 AI 解析</div>
          <div class="explain-loading" id="explainLoading">正在调用 DeepSeek 生成解析…</div>
          <div class="explain-body hidden" id="explainBody"></div>
        </div>

        <div class="settings">
          <label for="apiKeyInput">DeepSeek API Key（用于生成答案解析）</label>
          <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxx">
          <div class="hint">Key 仅保存在你的浏览器本地（localStorage），不会上传到任何第三方。申请地址：platform.deepseek.com</div>
        </div>
      </div>

      <div id="finishArea" class="finish hidden">
        <div class="emoji">🎉</div>
        <h2>刷题完成！</h2>
        <p id="finishText"></p>
        <div class="actions" style="justify-content:center;">
          <button class="btn" id="restartBtn">重新开始</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var CSV_URL = "https://raw.githubusercontent.com/vacuum139/my_project/refs/heads/main/%E9%A2%98%E5%BA%93.csv";
  var DEEPSEEK_URL = "https://api.deepseek.com/chat/completions";
  var MODEL = "deepseek-chat";

  // ---------- 状态 ----------
  var questions = [];   // [{type, stem, options, answer, analysis}]
  var current = 0;
  var score = 0;
  var selected = [];
  var submitted = false;

  // ---------- DOM ----------
  function $(id) { return document.getElementById(id); }
  var el = {
    loading: $("loading"), errorBox: $("errorBox"), errorMsg: $("errorMsg"),
    main: $("main"), progressText: $("progressText"), scoreText: $("scoreText"),
    progressFill: $("progressFill"), quizArea: $("quizArea"), qType: $("qType"),
    qStem: $("qStem"), options: $("options"), resultBanner: $("resultBanner"),
    submitBtn: $("submitBtn"), nextBtn: $("nextBtn"), explainBox: $("explainBox"),
    explainLoading: $("explainLoading"), explainBody: $("explainBody"),
    apiKeyInput: $("apiKeyInput"), finishArea: $("finishArea"),
    finishText: $("finishText"), restartBtn: $("restartBtn")
  };

  // ---------- API Key（本地保存） ----------
  var savedKey = localStorage.getItem("deepseek_api_key") || "";
  el.apiKeyInput.value = savedKey;
  el.apiKeyInput.addEventListener("input", function () {
    localStorage.setItem("deepseek_api_key", el.apiKeyInput.value.trim());
  });

  // ---------- 加载题库 ----------
  fetch(CSV_URL)
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(function (text) {
      var parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      parsed.data.forEach(function (row) {
        function pick() {
          for (var i = 0; i < arguments.length; i++) {
            var k = arguments[i];
            if (row[k] !== undefined && String(row[k]).trim() !== "") return String(row[k]).trim();
          }
          return "";
        }
        var type    = pick("题型", "类型", "type", "Type");
        var stem    = pick("题干", "题目", "题目内容", "stem", "question", "Question");
        var optsStr = pick("选项", "选项内容", "options", "Options");
        var answer  = pick("答案", "正确答案", "answer", "Answer");
        var analysis= pick("解析", "答案解析", "analysis", "Analysis");
        if (!stem) return;

        var options = [];
        if (optsStr) {
          var parts = optsStr.split(/\n|\||；|;/).filter(function (s) { return s.trim(); });
          parts.forEach(function (p) {
            var m = p.trim().match(/^([A-ZＡ-Ｚ])\s*[.、．:：]\s*(.+)$/);
            if (m) {
              var letter = m[1].replace(/Ａ/g,"A").replace(/Ｂ/g,"B").replace(/Ｃ/g,"C")
                               .replace(/Ｄ/g,"D").replace(/Ｅ/g,"E").replace(/Ｆ/g,"F");
              options.push({ label: letter, text: m[2].trim() });
            } else if (options.length) {
              options[options.length - 1].text += "\n" + p.trim();
            }
          });
        }

        if (!type) type = options.length > 2 ? "多选题" : (options.length === 2 ? "判断题" : "单选题");
        questions.push({ type: type, stem: stem, options: options, answer: answer, analysis: analysis });
      });

      if (!questions.length) throw new Error("题库为空或格式无法识别");
      el.loading.classList.add("hidden");
      el.main.classList.remove("hidden");
      renderQuestion();
    })
    .catch(function (err) {
      el.loading.classList.add("hidden");
      el.errorBox.classList.remove("hidden");
      el.errorMsg.textContent = String(err && err.message || err);
    });

  // ---------- 渲染 ----------
  function isMulti() { return /多选/.test(questions[current].type); }

  function renderQuestion() {
    var q = questions[current];
    submitted = false;
    selected = [];

    el.progressText.textContent = "第 " + (current + 1) + " / " + questions.length + " 题";
    el.progressFill.style.width = (current / questions.length * 100) + "%";
    el.qType.textContent = q.type;
    el.qStem.textContent = q.stem;

    el.resultBanner.className = "result-banner";
    el.resultBanner.textContent = "";
    el.explainBox.classList.add("hidden");
    el.explainBody.classList.add("hidden");
    el.explainBody.textContent = "";
    el.explainLoading.classList.remove("hidden");
    el.explainLoading.textContent = "正在调用 DeepSeek 生成解析…";

    el.submitBtn.classList.remove("hidden");
    el.submitBtn.disabled = false;
    el.nextBtn.classList.add("hidden");

    el.options.innerHTML = "";
    q.options.forEach(function (opt, idx) {
      var div = document.createElement("div");
      div.className = "option";
      div.innerHTML = '<span class="badge">' + opt.label + '</span><span class="opt-text"></span>';
      div.querySelector(".opt-text").textContent = opt.text;
      div.addEventListener("click", function () {
        if (submitted) return;
        if (isMulti()) {
          var pos = selected.indexOf(idx);
          if (pos >= 0) { selected.splice(pos, 1); div.classList.remove("selected"); }
          else { selected.push(idx); div.classList.add("selected"); }
        } else {
          selected = [idx];
          Array.prototype.forEach.call(el.options.children, function (c) { c.classList.remove("selected"); });
          div.classList.add("selected");
        }
      });
      el.options.appendChild(div);
    });
  }

  // ---------- 提交 ----------
  el.submitBtn.addEventListener("click", function () {
    if (!selected.length) { alert("请先选择答案"); return; }
    submitted = true;
    el.submitBtn.disabled = true;

    var q = questions[current];
    var answerSet = {};
    String(q.answer).toUpperCase().replace(/[^A-Z]/g, "").split("").forEach(function (c) { answerSet[c] = true; });
    var userSet = {};
    selected.forEach(function (i) { userSet[q.options[i].label] = true; });

    var correct = Object.keys(answerSet).sort().join("") === Object.keys(userSet).sort().join("");

    Array.prototype.forEach.call(el.options.children, function (div, idx) {
      var label = q.options[idx].label;
      div.classList.add("locked");
      if (answerSet[label]) div.classList.add("correct");
      else if (userSet[label]) div.classList.add("wrong");
    });

    if (correct) score++;
    el.scoreText.textContent = "得分：" + score;
    el.progressFill.style.width = ((current + 1) / questions.length * 100) + "%";

    el.resultBanner.className = "result-banner show " + (correct ? "ok" : "bad");
    el.resultBanner.textContent = correct
      ? "✅ 回答正确！"
      : "❌ 回答错误，正确答案：" + Object.keys(answerSet).sort().join("、");

    el.submitBtn.classList.add("hidden");
    el.nextBtn.classList.remove("hidden");
    el.nextBtn.textContent = current === questions.length - 1 ? "查看成绩 →" : "下一题 →";

    requestExplanation(q, userSet, answerSet, correct);
  });

  // ---------- DeepSeek 解析 ----------
  function requestExplanation(q, userSet, answerSet, correct) {
    el.explainBox.classList.remove("hidden");

    var apiKey = el.apiKeyInput.value.trim();
    if (!apiKey) {
      el.explainLoading.textContent = "未填写 DeepSeek API Key，无法获取 AI 解析。";
      return;
    }

    var userAnswer = Object.keys(userSet).sort().join("、") || "（未作答）";
    var rightAnswer = Object.keys(answerSet).sort().join("、");
    var optText = q.options.map(function (o) { return o.label + ". " + o.text; }).join("\n");

    var prompt = "你是一位专业的老师。请对下面这道题进行讲解。\n\n" +
      "题型：" + q.type + "\n" +
      "题干：" + q.stem + "\n" +
      "选项：\n" + optText + "\n" +
      "正确答案：" + rightAnswer + "\n" +
      "学生答案：" + userAnswer + "（" + (correct ? "答对了" : "答错了") + "）\n" +
      (q.analysis ? "题库自带解析（可参考）：" + q.analysis + "\n" : "") +
      "\n请分两部分输出：\n1. 逐项分析每个选项为什么对或错；\n2. 总结本题考查的知识点。\n要求条理清晰、简明扼要。";

    fetch(DEEPSEEK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + apiKey
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { role: "system", content: "你是一位耐心细致的老师，擅长用清晰的结构讲解题目。" },
          { role: "user", content: prompt }
        ],
        temperature: 0.5
      })
    })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + (res.status === 401 ? "（Key 无效）" : ""));
        return res.json();
      })
      .then(function (data) {
        var text = data.choices && data.choices[0] && data.choices[0].message
          ? data.choices[0].message.content : "（未返回内容）";
        el.explainLoading.classList.add("hidden");
        el.explainBody.classList.remove("hidden");
        el.explainBody.textContent = text;
      })
      .catch(function (err) {
        el.explainLoading.textContent = "解析获取失败：" + (err && err.message || err);
      });
  }

  // ---------- 下一题 / 重开 ----------
  el.nextBtn.addEventListener("click", function () {
    if (current === questions.length - 1) {
      el.quizArea.classList.add("hidden");
      el.finishArea.classList.remove("hidden");
      el.finishText.textContent = "共 " + questions.length + " 题，答对 " + score + " 题，正确率 " +
        Math.round(score / questions.length * 100) + "%";
    } else {
      current++;
      renderQuestion();
    }
  });

  el.restartBtn.addEventListener("click", function () {
    current = 0; score = 0;
    el.scoreText.textContent = "得分：0";
    el.finishArea.classList.add("hidden");
    el.quizArea.classList.remove("hidden");
    renderQuestion();
  });
})();
</script>
</body>
</html>
