<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场调查 · 智能刷题</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['"Noto Sans SC"', 'system-ui', 'sans-serif'] }
    }
  }
}
</script>
<style>
  body {
    background: radial-gradient(ellipse at top, #1e1b4b 0%, #0f172a 60%, #020617 100%);
    min-height: 100vh;
  }
  .glass {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .option-btn {
    transition: all .25s cubic-bezier(.4,0,.2,1);
  }
  .option-btn:not(:disabled):hover {
    transform: translateY(-2px);
    border-color: rgba(129,140,248,.7);
    background: rgba(129,140,248,.12);
  }
  .option-btn:disabled { cursor: default; opacity: .85; }
  .option-correct {
    border-color: #34d399 !important;
    background: rgba(52,211,153,.15) !important;
    box-shadow: 0 0 20px rgba(52,211,153,.25);
  }
  .option-wrong {
    border-color: #f87171 !important;
    background: rgba(248,113,113,.15) !important;
  }
  .option-dim { opacity: .35 !important; }
  .cursor-blink::after {
    content: '▍';
    color: #818cf8;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .fade-in { animation: fadeIn .5s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none;} }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,.25);
    border-top-color: #818cf8;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg);} }
  ::selection { background: rgba(129,140,248,.4); }
</style>
</head>
<body class="text-slate-100 font-sans">

<div class="max-w-3xl mx-auto px-4 py-10">

  <!-- Header -->
  <header class="text-center mb-10 fade-in">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass text-xs text-indigo-300 tracking-widest mb-4">
      <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
      AI 解析 · 市场调查刷题
    </div>
    <h1 class="text-4xl font-bold bg-gradient-to-r from-indigo-300 via-violet-300 to-fuchsia-300 bg-clip-text text-transparent">
      市场调查 · 智能刷题
    </h1>
    <p class="text-slate-400 mt-3 text-sm">答题后由 DeepSeek 老师逐题讲解易错点</p>
  </header>

  <!-- API Key 输入 -->
  <section id="keySection" class="glass rounded-2xl p-6 mb-8 fade-in">
    <label class="block text-xs font-medium text-indigo-300 mb-2 tracking-wider">DEEPSEEK API KEY</label>
    <div class="flex gap-3">
      <input id="apiKey" type="password" placeholder="sk-xxxxxxxxxxxxxxxx"
        class="flex-1 bg-slate-900/60 border border-white/10 rounded-xl px-4 py-2.5 text-sm
               placeholder-slate-500 focus:outline-none focus:border-indigo-400/70 focus:ring-2 focus:ring-indigo-500/20 transition" />
      <button onclick="toggleKey()" class="px-4 py-2.5 rounded-xl text-xs glass hover:bg-white/10 transition">显示</button>
    </div>
    <button id="startBtn" onclick="startQuiz()"
      class="mt-4 w-full py-3 rounded-xl font-semibold text-sm text-white
             bg-gradient-to-r from-indigo-500 to-violet-600
             hover:from-indigo-400 hover:to-violet-500
             shadow-lg shadow-indigo-900/50 hover:shadow-indigo-700/50
             transition-all active:scale-[0.98]">
      🚀 开始答题
    </button>
    <p class="text-slate-500 text-xs mt-3 text-center">填写 API Key 后点击按钮，或直接在输入框按 <kbd class="px-1.5 py-0.5 rounded bg-white/10 text-slate-300">回车</kbd> 开始</p>
    <p id="keyWarn" class="hidden text-amber-400/90 text-xs mt-2 text-center">⚠ 请先填写 API Key</p>
  </section>

  <!-- 已就绪提示（开始答题后显示） -->
  <div id="readyBar" class="hidden mb-6 fade-in">
    <div class="glass rounded-2xl px-5 py-3 flex items-center justify-between">
      <span class="text-sm text-slate-300">🔑 API Key 已就绪，点击任意选项提交并获取 AI 解析</span>
      <button onclick="resetQuiz()" class="text-xs text-indigo-300 hover:text-indigo-200 transition">重置</button>
    </div>
  </div>

  <!-- Questions（初始隐藏） -->
  <main id="quizRoot" class="space-y-8 hidden"></main>

  <!-- Footer -->
  <footer class="text-center text-slate-500 text-xs mt-12">
    数据仅存储在浏览器本地 · 不会上传至任何服务器
  </footer>
</div>

<script>
/* ================= 题库 ================= */
const QUESTIONS = [
  {
    id: 1,
    question: "在市场调查中，以下哪种抽样方法属于非概率抽样？",
    options: [
      "A. 分层随机抽样",
      "B. 系统抽样",
      "C. 整群抽样",
      "D. 方便抽样（便利抽样）"
    ],
    answer: 3  // index
  },
  {
    id: 2,
    question: "一份问卷在正式发放前，先邀请少量目标受访者试填，目的是：",
    options: [
      "A. 提高样本代表性",
      "B. 检验问卷的信度与效度、发现表述问题",
      "C. 降低调查成本",
      "D. 扩大调查覆盖面"
    ],
    answer: 1
  },
  {
    id: 3,
    question: "某企业想了解消费者对其新产品的购买意愿，调查对象应为：",
    options: [
      "A. 该企业全体员工",
      "B. 所有零售商",
      "C. 该产品的潜在目标消费者",
      "D. 行业竞争对手"
    ],
    answer: 2
}
];

const letters = ["A","B","C","D"];
let started = false;

/* ================= 开始答题 ================= */
function startQuiz() {
  const key = document.getElementById('apiKey').value.trim();
  const warn = document.getElementById('keyWarn');
  if (!key) {
    warn.classList.remove('hidden');
    document.getElementById('apiKey').focus();
    return;
  }
  warn.classList.add('hidden');
  document.getElementById('keySection').classList.add('hidden');
  document.getElementById('readyBar').classList.remove('hidden');

  if (!started) {
    started = true;
    renderQuestions();
  }
  document.getElementById('quizRoot').classList.remove('hidden');
  document.getElementById('quizRoot').scrollIntoView({behavior:'smooth', block:'start'});
}

/* 回车键直接开始 */
document.getElementById('apiKey').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    startQuiz();
  }
});

/* 重置：重新显示输入框 */
function resetQuiz() {
  document.getElementById('keySection').classList.remove('hidden');
  document.getElementById('readyBar').classList.add('hidden');
  document.getElementById('quizRoot').classList.add('hidden');
  document.getElementById('keySection').scrollIntoView({behavior:'smooth', block:'center'});
}

/* ================= 渲染题目 ================= */
const root = document.getElementById('quizRoot');

function renderQuestions() {
  QUESTIONS.forEach((q, qi) => {
    const card = document.createElement('div');
    card.id = `q${q.id}`;
    card.className = 'glass rounded-2xl p-6 fade-in';
    card.style.animationDelay = `${qi * 0.12}s`;
    card.innerHTML = `
      <div class="flex items-center gap-3 mb-4">
        <span class="w-8 h-8 shrink-0 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-sm font-bold shadow-lg shadow-indigo-900/50">${q.id}</span>
        <h2 class="text-base font-semibold leading-relaxed">${q.question}</h2>
      </div>
      <div class="grid gap-3" id="opts-${q.id}">
        ${q.options.map((opt, i) => `
          <button data-q="${q.id}" data-i="${i}"
            class="option-btn text-left w-full px-4 py-3 rounded-xl border border-white/10 bg-white/5 text-sm leading-relaxed">
            <span class="inline-block w-6 text-indigo-300 font-semibold">${letters[i]}.</span>${opt.replace(/^[A-D]\.\s*/, '')}
          </button>`).join('')}
      </div>
      <div id="analysis-${q.id}" class="hidden mt-5">
        <div class="border-t border-white/10 pt-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-xs font-semibold text-indigo-300 tracking-widest">AI 解析</span>
            <span id="status-${q.id}" class="text-xs text-slate-400"></span>
          </div>
          <div id="text-${q.id}" class="text-sm leading-7 text-slate-200 whitespace-pre-wrap min-h-[1.75rem]"></div>
        </div>
      </div>
    `;
    root.appendChild(card);
  });
}

/* ================= 交互逻辑 ================= */
root.addEventListener('click', e => {
  const btn = e.target.closest('button.option-btn');
  if (!btn || btn.disabled) return;
  const qid = +btn.dataset.q;
  const picked = +btn.dataset.i;
  const q = QUESTIONS.find(x => x.id === qid);

  // 本组选项锁定 + 标色
  document.querySelectorAll(`#opts-${qid} button`).forEach(b => {
    b.disabled = true;
    const i = +b.dataset.i;
    if (i === q.answer) b.classList.add('option-correct');
    else if (i === picked) b.classList.add('option-wrong');
    else b.classList.add('option-dim');
  });

  fetchAnalysis(q);
});

function toggleKey() {
  const inp = document.getElementById('apiKey');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function fetchAnalysis(q) {
  const key = document.getElementById('apiKey').value.trim();
  const box = document.getElementById(`analysis-${q.id}`);
  const status = document.getElementById(`status-${q.id}`);
  const textEl = document.getElementById(`text-${q.id}`);

  box.classList.remove('hidden');
  textEl.innerHTML = '';
  textEl.classList.remove('cursor-blink');
  status.innerHTML = '<span class="inline-flex items-center gap-2"><span class="spinner"></span>正在请求 DeepSeek 解析…</span>';

  const correctText = q.options[q.answer].replace(/^[A-D]\.\s*/, '');
  const prompt = `请作为一名老师，用100字左右分析这道题为什么选【${correctText}】，并指出易错点。题目：【${q.question}】`;

  try {
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: '你是一位耐心细致的市场调查课程老师，讲解简明扼要。' },
          { role: 'user', content: prompt }
        ],
        temperature: 0.7,
        max_tokens: 300
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const content = data.choices?.[0]?.message?.content?.trim() || '（接口返回为空）';

    status.textContent = '✓ 解析完成';
    typewriter(textEl, content);
  } catch (err) {
    status.textContent = '';
    textEl.innerHTML = `<span class="text-red-300">请求失败：${escapeHtml(err.message)}</span><br><span class="text-slate-400 text-xs">请检查 API Key 是否正确、网络是否正常（注意跨域与额度限制），然后重新点击选项重试。</span>`;
  }
}

/* ================= 打字机效果 ================= */
let timer = null;
function typewriter(el, text) {
  if (timer) clearInterval(timer);
  el.textContent = '';
  el.classList.add('cursor-blink');
  let i = 0;
  timer = setInterval(() => {
    el.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(timer);
      timer = null;
      el.classList.remove('cursor-blink');
    }
  }, 35);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
</script>
</body>
</html>
